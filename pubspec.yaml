name: pip
description: Макет приложения студии Pip на Flutter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

# Библиотеки, которые нужны приложению.
dependencies:
  cupertino_icons: 1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.3 # Открытие сайта, Telegram и почты.

# Инструменты для проверки кода и тестов.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
