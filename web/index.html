<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    При сборке Flutter подставляет сюда путь к приложению на сайте.
    Если приложение находится в подпапке, укажи её через --base-href=/pip/.
    Путь должен начинаться и заканчиваться символом /.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Клиент студии Pip: услуги, проекты, блог и заявки.">
  <meta name="theme-color" content="#111118">

  <!-- Название и значок приложения при добавлении на экран телефона. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pip">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Значок вкладки браузера. -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pip</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background: #111118;">
  <!-- Этот скрипт загружает собранное Flutter-приложение. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
